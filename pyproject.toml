[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "recruitsecbench"
version = "0.1.0"
description = "Reproducible security benchmark for recruitment agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "RecruitSecBench contributors" }]
dependencies = [
  "jsonschema>=4.23,<5",
  "pydantic>=2.7,<3",
  "pymupdf>=1.28.0",
  "pypdf>=5,<7",
  "pyyaml>=6,<7",
  "reportlab>=4,<5",
  "typer>=0.12,<1",
]

[project.scripts]
rscb = "recruitsecbench.cli.main:main"

[dependency-groups]
dev = [
  "bandit>=1.7,<2",
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "ruff>=0.5,<1",
  "types-jsonschema>=4.23,<5",
  "types-pyyaml>=6,<7",
  "types-reportlab>=4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/recruitsecbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["recruitsecbench"]

[[tool.mypy.overrides]]
module = ["fitz"]
ignore_missing_imports = true

[tool.bandit]
targets = ["src"]
skips = ["B101"]
