[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "recruitsecbench"
version = "0.1.0"
description = "Security benchmark for recruitment questionnaire generation and evaluation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "RecruitSecBench contributors" }]
dependencies = [
  "agno>=2.6.5,<3",
  "fastapi>=0.116,<0.117",
  "langdetect>=1.0.9",
  "langfuse>=4.14.0,<5",
  "ollama>=0.6.2",
  "openai>=1.0.0",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7",
  "python-dotenv>=1.0",
  "pyyaml>=6,<7",
  "structlog>=24.4",
  "uvicorn[standard]>=0.35,<0.36",
]

[project.scripts]
rscb-questionnaire = "rscb_questionnaire.cli:main"
rscb-questionnaire-battery = "rscb_questionnaire.battery:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25",
  "ruff>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rscb_questionnaire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "PL", "W"]
ignore = ["E501", "PLR0913"]
